services:
  # --- Backend FastAPI Web Service ---
  - type: web
    name: alinlab-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alinlab-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

  # --- Frontend React Static Site ---
  - type: web
    name: alinlab-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # --- PostgreSQL Database ---
  - name: alinlab-db
    databaseName: alinlab
    plan: free
    region: frankfurt
